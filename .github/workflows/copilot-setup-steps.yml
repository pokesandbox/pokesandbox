name: Copilot Setup Steps

# Prepares the GitHub Copilot coding agent's environment before it starts work:
# Node from .nvmrc and the dependencies, so it can run `npm run affected` (see
# AGENTS.md). Unlike CI, `npm ci` runs install scripts here, so the husky hooks
# (formatting, commit-message format, typecheck on push) apply to the agent's
# commits too. The job must be named `copilot-setup-steps` for Copilot to use it.
# The triggers below only validate the workflow when it changes.

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected compares with origin/develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
