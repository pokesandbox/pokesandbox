name: DB check

# Runs the local setup end to end (`npm run setup`: .env, Mongo replica set via
# docker compose, seed) and proves transactions work (`npm run db:check`).
# Only runs when the local database setup changes.

on:
  pull_request:
    branches: [develop]
    paths:
      - docker-compose.yml
      - .env.example
      - package.json
      - scripts/db/**
      - scripts/seed/**
      - scripts/env-setup.js
      - .github/workflows/db-check.yml
  push:
    branches: [develop]
    paths:
      - docker-compose.yml
      - .env.example
      - package.json
      - scripts/db/**
      - scripts/seed/**
      - scripts/env-setup.js
      - .github/workflows/db-check.yml

permissions:
  contents: read

concurrency:
  group: db-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  db-check:
    name: DB check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The seed requires a guild ID; this placeholder is not a real server.
      DEV_GUILD_ID: '000000000000000000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up local environment (env, Mongo replica set, seed)
        run: npm run setup

      - name: Prove transactions work
        run: npm run db:check

      - name: Mongo logs on failure
        if: failure()
        run: docker compose logs mongodb

      - name: Tear down
        if: always()
        run: docker compose down -v
