name: Pages

on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - 'docs/design/**'
      - 'scripts/build-pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: bash scripts/build-pages.sh _site
        env:
          DESIGN_PATH: ${{ vars.DESIGN_PATH }}
          PROTOTYPE_PATH: ${{ vars.PROTOTYPE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
