<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PokeSandbox: under construction</title>
    <meta
      name="description"
      content="Build your own Pokémon region and play it with your Discord server."
    />
    <script>
      if (matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main class="hero">
      <img
        class="hero-art"
        src="/assets/hero-desktop-1712.webp"
        srcset="
          /assets/hero-desktop-1712.webp 1712w,
          /assets/hero-desktop-3424.webp 3424w
        "
        sizes="100vw"
        width="1712"
        height="624"
        alt="A sandcastle island with winding golden paths, out in a calm sea"
      />
      <div class="hero-panel">
        <span class="badge t-caption">Under construction</span>
        <h1 class="t-display">PokeSandbox</h1>
        <p class="t-body">
          Build your own Pokémon region and play it with your Discord server.
          We're still building it. Follow along or come say hi.
        </p>
        <div class="actions">
          <a
            class="button button-secondary t-label"
            href="https://github.com/pokesandbox/pokesandbox"
            >GitHub</a
          >
          <a
            class="button button-discord t-label"
            href="https://discord.gg/5BSMak3m9V"
            >Join the Discord</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
