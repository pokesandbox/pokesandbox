# Single SonarCloud project for the whole monorepo, scanned from the repo root by
# .github/workflows/ci.yml. When a new app or lib is added (libs/engine, ...),
# add its src dir to sonar.sources / sonar.tests and its lcov file to
# sonar.javascript.lcov.reportPaths.
# Don't set sonar.projectVersion here: ci.yml sets it per develop commit.

sonar.organization=pokesandbox
sonar.projectKey=pokesandbox_pokesandbox
sonar.projectName=PokeSandbox

sonar.sources=apps/bot/src,apps/webapp/src,shared/src,libs/core/src
sonar.tests=apps/bot/src,apps/webapp/src,apps/webapp/specs,shared/src,libs/core/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/testing/**

sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/testing/**,**/mocks/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/testing/**,**/mocks/**,**/*.config.*,**/*.d.ts
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/testing/**,**/mocks/**

# Paths inside these files are rewritten to repo-relative by scripts/ci/normalize-lcov.sh.
# On PRs only affected projects run tests, so some of these may be missing; Sonar
# warns and continues (PR analysis only measures new code).
sonar.javascript.lcov.reportPaths=coverage/apps/bot/lcov.info,coverage/apps/webapp/lcov.info,coverage/shared/lcov.info,coverage/libs/core/lcov.info
